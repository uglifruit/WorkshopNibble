summary: |
  NIBBLE makes the Workshop System's FOUR VOLTAGES module playable. Patch one of
  its outputs into CV In 1, teach the card which voltage each button combination
  produces, and the ten combinations become ten degrees of a scale - or a lo-fi
  drum kit with a looper behind it.<br><br>

  Four buttons is four bits is one nibble.<br><br>

  THE PROBLEM IT SOLVES: Four Voltages does not return to a rest voltage when you
  let go - the output sits at the last-pressed button's level. Releasing A+B
  leaves the voltage sitting exactly where pressing A alone would put it, so a
  naive design fires a spurious note every time you lift a finger. NIBBLE ignores
  that one specific level, and only that one, until the voltage moves somewhere
  else.<br><br>

  The payoff is the way you play it: HOLD one button and TAP the others. Hold C,
  tap A for one sound, tap B for another, indefinitely, with no ghost notes. The
  held finger is a bank select and the tapping finger plays.<br><br>

  Hold the momentary switch for two seconds to calibrate - ten steps, each
  confirmed by a tap, with the LEDs laid out in the same 2x2 as the buttons so
  the display is the instruction. Calibration is deliberately NOT saved: the
  Four Voltages knob changes every voltage it makes, so a remembered calibration
  would be a wrong one.<br><br>

  The combinations play scale DEGREES rather than pitches, so the voltage only
  ever decides which combination you pressed - move the Four Voltages knob,
  re-learn, and the same buttons give you the same notes back. Twelve scales on
  Knob Y, ordered dark to bright.<br><br>

  Hold the momentary switch at power-on for DRUMS. There a SINGLE button is a
  shift rather than a sound and only pairs trigger, which is what lets you hold
  one button and tap the others to repeat a hit as fast as you like - percussion
  is mostly repeated hits on the same drum, and a keyboard reading of the buttons
  cannot do that.<br><br>

  TWELVE voices, not six, because holding A and tapping B is a different gesture
  from holding B and tapping A. Those close the same switches and give an
  identical voltage - press order is not in the signal - but the level the
  voltage came FROM is the button that was already down, and latching that
  recovers the ordering for nothing. Hold C and your right hand has closed hat,
  snare and kick under three fingers; hold D for the tom row; A and B carry the
  colour, including the crash.<br><br>

  A four-bar event looper whose overdub is lossless because it records events
  rather than audio, clockable from Pulse In 1, a DJ filter whose movements can
  be recorded into the loop, and a click track on Pulse Out 2.

panel:
  inputs:
    - id: CVIn1
      name: Four Voltages
      type: cv
      description: Patch one output of the Four Voltages module here. This is the keyboard. The card learns which voltage each button combination produces, so it works at any position of the Four Voltages knob - re-learn whenever you move it. If two combinations cannot be told apart the card says so during calibration rather than guessing.
    - id: CVIn2
      name: Transpose
      type: cv
      description: 1V/oct transpose of the whole keyboard, up to two octaves, quantised to semitones so an imprecise voltage cannot leave everything slightly sharp. The root of the scale sits at 0V, so this transposes upward from there. KEYS only, and only active when something is patched. Ignored in DRUMS.
    - id: PulseIn1
      name: Retrigger / Clock*
      type: pulse
      description: KEYS - re-fires the current note without changing it, which is how you play repeated notes. DRUMS - an external clock at one pulse per beat, which takes over from Knob X for as long as it keeps arriving and hands back about three seconds after it stops. It nudges into phase rather than snapping, so locking to a clock never stutters the pattern.
    - id: PulseIn2
      name: Unused
      type: pulse
      description: Not used in this version.
  outputs:
    - id: CVOut1
      name: Pitch / Bassline*
      type: cv
      description: "KEYS - calibrated 1V/oct pitch, stepped, or glided when the switch is up. The root of the scale is 0V, so an oscillator at its own zero is already in tune. DRUMS - a four-note bassline played by the single buttons, which make no drum sound and so had a spare output: A is the root, B a tone below, C the fifth, D the octave. No combos and no scale - once a pattern is looping you can put a simple line under it with the same four buttons."
    - id: CVOut2
      name: Harmony / Unused*
      type: cv
      description: KEYS - a second calibrated 1V/oct pitch, a third above the note you played and picked from the same scale, so it lands major or minor according to where in the scale you are. Patch it to a second oscillator with Pulse Out 1 as a shared gate and the ten buttons play two-part harmony. DRUMS - unused.
    - id: AudioOut1
      name: Filter Env / Drums*
      type: audio
      description: KEYS - a snappier envelope intended for a filter cutoff. DRUMS - the drum bus, after the DJ filter.
    - id: AudioOut2
      name: Loudness Env / Drums*
      type: audio
      description: KEYS - an amplitude envelope, with accent behaviour at the top of the macro. DRUMS - the same drum bus as Audio Out 1, so either socket gives you the whole kit.
    - id: PulseOut1
      name: Gate
      type: pulse
      description: "Fires on every note or drum hit, from the buttons, from a retrigger, or from the loop. In DRUMS it also gates the bassline the single buttons play."
    - id: PulseOut2
      name: Click*
      type: pulse
      description: DRUMS - a click track, one blip per crotchet, running whenever the loop is, so there is something to record along to. KEYS - unused.

controls:
  switch:
    up:
      name: Glide / Record*
      description: KEYS - fast glide between notes instead of stepping; the harmony voice glides with it. DRUMS - record and overdub into the loop; the loop keeps running, and because it stores events rather than audio, overdubbing never degrades what is already there.
    middle:
      name: Step / Play*
      description: KEYS - pitch steps straight to each new note. DRUMS - the loop plays, and you can play along without recording.
    down:
      name: Calibrate
      description: Calibration starts automatically at power-on, since the learned levels are never saved. HOLD for two seconds to start another, in either mode - and in DRUMS this also ERASES the loop, which is the erase gesture. Hold again during calibration to abandon it and keep the previous one. Calibration fails visibly, with the two LED columns alternating, if nothing usable is coming in on CV In 1.
    tap:
      name: Retrigger / Capture
      description: In play, re-fires the current note or sound. During calibration, captures the combination you are holding.
  knobs:
    -
      main:
        name: Macro / DJ Filter*
        description: KEYS - how long the note lasts, from a click to over five seconds, across both envelopes at once. DRUMS - a DJ filter, low-pass to the left, high-pass to the right, with a generous bypass at centre you can find by feel. Its movements are recorded into the loop.
      x:
        name: Balance / Tempo*
        description: KEYS - how that length is split between the filter and the loudness, morphing continuously between DARK (the filter shuts well before the note fades - plucks), BALANCED, and BRIGHT (the filter outlasts the amplitude so the note blooms - pads). DRUMS - tempo, 40 to 240 BPM, ignored while an external clock is running on Pulse In 1. Changing it re-times the pattern rather than pitching it.
      y:
        name: Scale / Kit*
        description: "KEYS - one of twelve scales, ordered dark to bright from fully anticlockwise, shown on the LEDs as a bar while you turn it: Phrygian, Hirajoshi, Harmonic Minor, Natural Minor, Minor Pentatonic, m7 Arpeggio, Dorian, Major Pentatonic, Ionian (Major), Maj7 Arpeggio, Whole Tone, Chromatic. Because the ten combinations are ten DEGREES, the scale also sets the range - a four-note arpeggio spreads them over more than two octaves while Chromatic packs them into three quarters of one. DRUMS - the character of the whole kit at once, from lower and longer to higher and shorter."
  leds:
    -
      display: list
      items:
        - id: LED0-3
          name: Buttons A B / C D
          description: Laid out in the same 2x2 as the Four Voltages buttons, and used that way everywhere - they show which combination is currently held, they flash on each hit, and during calibration they show you which combination to press next, so the display is the instruction rather than a code to decode.
        - id: LED4
          name: Beat
          description: DRUMS - pulses on the beat, matching the click on Pulse Out 2. During calibration it marks the four single-button steps. Dark while playing in KEYS - the combo LEDs already show every note, and a second light saying the same thing only competes with them.
        - id: LED5
          name: Calibration / Record
          description: DRUMS - lit while recording. During calibration it marks the six two-button steps. Dark while playing in KEYS - it used to sit on to mean calibrated, which is not something you can act on mid-performance. Collisions are reported once at the end of a calibration instead.

host:
  notes: |
    WHAT TO PATCH

    One output of the Four Voltages module into CV In 1. That is the whole
    required patch. Four Voltages has four outputs and they respond differently
    to the same buttons - if one gives you two combinations that collide during
    calibration, try another before changing anything else.

    CALIBRATION

    Hold the momentary switch for two seconds. Ten steps: the four single
    buttons, then the pairs as top row, bottom row, left column, right column,
    and the two diagonals - an order chosen so your hand alternates shape rather
    than re-forming similar grips. Hold each combination and TAP the switch to
    capture it.

    All six LEDs flash to confirm. LEDs 4 and 5 flashing once means the voltage
    was still moving - hold steady and tap again. Flashing three times means the
    capture was kept but that combination is too close to an earlier one to
    separate reliably; the calibration still completes, and you can move the
    Four Voltages knob and run it again.

    Calibration is NOT saved across power cycles, on purpose. The Four Voltages
    knob moves every voltage it produces, so a remembered calibration would be a
    wrong one - and a card that looks calibrated while playing the wrong notes is
    worse than one that admits it knows nothing.

    HOW IT LISTENS

    Ten combinations are learned: the four singles and the six pairs. Three- and
    four-button presses produce voltages that match nothing, and the card does
    nothing with them rather than snapping to the nearest note.

    Because Four Voltages does not return to a rest voltage, releasing a pair
    leaves the output sitting on one of that pair's own buttons. The card ignores
    that one level - and only that one, only until the voltage moves elsewhere.
    So A+B released to A is silent, but pressing B straight afterwards plays,
    and returning to A later plays too.

    NOTES, NOT VOLTAGES

    The combinations map to scale DEGREES rather than to pitches. The voltage
    only ever decides WHICH combination you pressed. That means moving the Four
    Voltages knob and re-learning gives you exactly the same notes back, which
    would not be true of a quantiser reading those voltages as pitches.

